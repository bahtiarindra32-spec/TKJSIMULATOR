name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (strict, src + tests)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Build
        run: npx vite build
